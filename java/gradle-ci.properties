# Gradle properties for CI/automated builds
# These settings help avoid lock issues during builds
# Use this file by running: ./gradlew -P gradle.properties=gradle-ci.properties

# Disable Gradle daemon to avoid lock conflicts
org.gradle.daemon=false

# Disable parallel execution to avoid race conditions
org.gradle.parallel=false

# Use only one worker to avoid parallel execution issues
org.gradle.workers.max=1

# Configure build cache
org.gradle.caching=false

# JVM memory settings with increased heap
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Longer timeouts for dependency resolution
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Disable build scan to avoid additional network calls
systemProp.scan.disabled=true

# Configure console output
org.gradle.console=plain

# Disable Gradle welcome message
org.gradle.welcome=never